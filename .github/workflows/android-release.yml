name: Android - build de release

# Fase 11.12 - disparo manual só: nada aqui roda em push/PR. O objetivo é validar o build de
# release e a assinatura (via os 4 secrets ANDROID_RELEASE_*) sob demanda, nunca publicar nada
# automaticamente - isso continua sendo uma decisão separada (Stella Hub/Releases), não deste
# workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou commit para buildar"
        required: false
        default: "claude/escala-church-android-5uch4n"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android (platform 34, build-tools 34.0.0)
        # android-actions/setup-android@v3 falha hoje tentando instalar o pacote legado "tools"
        # (removido do repositório do SDK há tempos) - runners ubuntu-latest já vêm com
        # ANDROID_HOME/sdkmanager prontos, então só aceitamos as licenças e instalamos exatamente
        # o que o projeto precisa (mesmos componentes usados em todo o resto desta entrega).
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -path "*/bin/*" | sort -V | tail -1)
          echo "Usando: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: local.properties (placeholder - este CI nunca tem Supabase real)
        run: |
          cat > local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder-anon-key
          CHURCH_ID=00000000-0000-0000-0000-000000000000
          SITE_URL=
          EOF

      - name: Testes, lint, build debug
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Build release (assinado se os 4 secrets existirem, senão sem assinatura)
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Confirma se o APK ficou assinado, e com qual certificado
        run: |
          # Sem nenhum signingConfig aplicado (os 4 secrets vazios/ausentes), o Android Gradle
          # Plugin nomeia a saída "app-release-unsigned.apk", não "app-release.apk" - procurar os
          # dois nomes em vez de presumir qual existe.
          APK=""
          for CANDIDATE in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            if [ -f "$CANDIDATE" ]; then APK="$CANDIDATE"; break; fi
          done

          if [ -z "$APK" ]; then
            echo "RESULTADO: nenhum APK de release encontrado em app/build/outputs/apk/release/ - o build falhou antes de empacotar."
            ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "(diretório não existe)"
            exit 1
          fi

          echo "Arquivo: $APK"
          echo "SHA-256 do APK: $(sha256sum "$APK" | cut -d' ' -f1)"
          if [ "$(basename "$APK")" = "app-release-unsigned.apk" ]; then
            echo "RESULTADO: APK SEM ASSINATURA (nome do arquivo já confirma: *-unsigned.apk) - os 4 secrets ANDROID_RELEASE_* vieram vazios nesta execução. Confira os nomes exatos em Settings > Secrets and variables > Actions."
          elif "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null; then
            echo "RESULTADO: APK assinado (ver certificado acima)."
          else
            echo "RESULTADO: arquivo chamado app-release.apk mas apksigner não confirma uma assinatura válida - investigar."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_ENV"

      - name: Publica o APK como artifact do run
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.apk_path }}
          retention-days: 14
